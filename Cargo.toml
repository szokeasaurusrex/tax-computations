[workspace]
resolver = "3"
members = [
    "ecb-data-parser",
    "meldefonds-corrections-parser",
    "trades-parser",
    "trades-parser-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
ecb-data-parser = { version = "0.1.0", path = "ecb-data-parser" }
meldefonds-corrections-parser = { version = "0.1.0", path = "meldefonds-corrections-parser" }
rust_decimal = "1.42.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
trades-parser = { version = "0.1.0", path = "trades-parser" }

[workspace.lints.clippy]
correctness = { level = "forbid", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = { level = "deny", priority = -1 }
must_use_candidate = "allow"
